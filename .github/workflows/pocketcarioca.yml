# PocketCarioca's APK: builds on every push to this fork (the upstream workflows only run on a
# tag or by hand). Same toolchain and checks as `android.yml`.
name: pocketcarioca

on:
  push:
  workflow_dispatch:

concurrency:
  group: pocketcarioca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: pocketcarioca-arm64

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: NDK and SDK platform
        run: |
          version=$(grep -oP 'ANDROID_NDK_DEFAULT=\K[0-9.]+' frontends/android/build.sh)
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$version" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the library and the APKs
        run: frontends/pocketcarioca/build.sh --apk

      - name: The APK carries an AArch64 library
        shell: bash
        run: |
          apk=frontends/pocketcarioca/app/app/build/outputs/apk/PocketCarioca-release.apk
          unzip -l "$apk" | grep "lib/arm64-v8a/"
          mkdir -p check && unzip -o -j "$apk" "lib/arm64-v8a/*.so" -d check > /dev/null
          for so in check/*.so; do file "$so" | grep -Eiq 'aarch64' || { echo "$so is not AArch64"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: PocketCarioca-apk
          path: frontends/pocketcarioca/app/app/build/outputs/apk/PocketCarioca-*.apk
          if-no-files-found: error
